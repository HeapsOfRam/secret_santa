[project]
name = "wishlist"
version = "0.1.0"
description = "wishlist picker"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wishlist"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
